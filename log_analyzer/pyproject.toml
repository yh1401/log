[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "log_analyzer"
version = "2.5.2"
description = "LLM based large-scale log analyzer and PCAP analysis system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25.0",
  "aiofiles>=23.0.0",
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "python-multipart>=0.0.6",
  "reportlab>=4.0.0",
  "python-docx>=1.1.0",
  "markdown>=3.4.0",
  "weasyprint>=69.0",
  "requests>=2.34.2",
]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["log_analyzer"]
include-package-data = true
